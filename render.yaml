services:
  - type: web
    name: discovery-engine
    runtime: python
    plan: free
    branch: feature/discovery-engine-overhaul
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.app.api:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.9"
